<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CooksHaven</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="add-recipe.css" />
  </head>
  <body>
    <div class="main-div">
      <h1>Cooks<span>Haven</span></h1>
      <button class="back-button"><a href="index.html">Go Back</a></button>
      <form>
        <div>
          <h3>New recipe</h3>
        </div>
        <div class="form-div">
          <div class="fields-div">
            <label for="recipe-name">Recipe name:</label><br />
            <input
              id="recipe-name"
              type="text"
              placeholder="Enter the recipe name"
              required
            />
          </div>
          <div class="fields-div">
            <label for="author"> Author:</label><br />
            <input
              id="author"
              type="text"
              placeholder="Enter the author name"
              required
            />
          </div>
          <div class="fields-div">
            <label for="file-upload">Upload recipe:</label><br />
            <input id="file-upload" type="file" required />
          </div>
          <div class="fields-div">
            <label for="video-link"> Paste a video link:</label><br />
            <input
              type="url"
              id="video-link"
              name="video_url"
              placeholder="https://example.com"
              pattern="https://.*"
              title="Please include https://"
            />
          </div>
          <div class="button-div">
            <button type="submit">Add recipe</button>
            <button class="secondary-button" type="reset">Clear</button>
          </div>
        </div>
      </form>
    </div>
  </body>
</html>
